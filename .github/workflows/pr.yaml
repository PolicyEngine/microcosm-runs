name: Pull request
on:
  pull_request:
permissions:
  contents: read
# A new push to a pull request supersedes the run on its previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rhysd/actionlint 1.7.12, which also runs shellcheck on `run:` steps.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
  changelog:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash .github/check-changelog.sh
  verify:
    uses: ./.github/workflows/ci.yml
  # The main ruleset requires this check by name.
  required:
    name: Required checks
    if: always()
    needs: [lint-workflows, changelog, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success"
